name: Seller commercial and delivery MVP

on:
  push:
    branches:
      - feat/seller-commercial-delivery-mvp
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'apps/seller/**'
      - 'packages/database/**'
      - '.github/workflows/seller-commercial-delivery.yml'

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://localhost:5432/ci_validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
